name: Build unified KannadaWords workbook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "master-lexicon.json"
      - "lexicon-source/entries/**"
      - "exports/additional-173.csv"
      - "scripts/export-master-workbook.py"
      - ".github/workflows/build-master-workbook.yml"

permissions:
  contents: write

jobs:
  build-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook dependency
        run: python -m pip install openpyxl
      - name: Build one-sheet master workbook
        run: python scripts/export-master-workbook.py
      - name: Commit generated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/kannadawords-master-lexicon.xlsx
          if git diff --cached --quiet; then
            echo "Workbook is already current."
          else
            git commit -m "Build unified KannadaWords master workbook [skip ci]"
            git push
          fi
