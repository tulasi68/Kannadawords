name: Lexicon compile

on:
  push:
    branches: [main, "architecture/**", "fix/**"]
    paths:
      - "lexicon-source/**"
      - "master-lexicon.json"
      - "master-vocabulary.json"
      - "landing-words.json"
      - "root-families.json"
      - "textbook-words.json"
      - "newspaper-vocabulary.json"
      - "lexicon-dist/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/lexicon-compile.yml"
  pull_request:
    paths:
      - "lexicon-source/**"
      - "master-lexicon.json"
      - "master-vocabulary.json"
      - "landing-words.json"
      - "root-families.json"
      - "textbook-words.json"
      - "newspaper-vocabulary.json"
      - "lexicon-dist/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/lexicon-compile.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lexicon:validate
      - run: npm run lexicon:schema
      - run: npm run lexicon:check
      - run: npm run lexicon:build
      - run: npm run lexicon:check
      - run: npm run vocabulary:build
      - run: npm run vocabulary:check
