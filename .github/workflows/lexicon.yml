name: Lexicon integrity

on:
  push:
    branches: [main, "architecture/**"]
    paths:
      - "lexicon-source/**"
      - "lexicon-dist/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "app.js"
      - "index.html"
      - "lexicon-store.js"
      - "lexicon-display-adapter.js"
      - "mobile-assistant.js"
      - "README.md"
      - "docs/**"
      - "migration/**"
      - "master-lexicon.json"
      - "master-vocabulary.json"
      - "landing-words.json"
      - "root-families.json"
      - "textbook-words.json"
      - "master-lexicon.json"
      - "master-vocabulary.json"
      - "landing-words.json"
      - "root-families.json"
      - "textbook-words.json"
      - ".github/workflows/lexicon.yml"
  pull_request:
    paths:
      - "lexicon-source/**"
      - "lexicon-dist/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "app.js"
      - "index.html"
      - "lexicon-store.js"
      - "lexicon-display-adapter.js"
      - "mobile-assistant.js"
      - "README.md"
      - "docs/**"
      - "migration/**"
      - ".github/workflows/lexicon.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run lexicon:validate
      - run: npm run lexicon:migration-check
      - run: npm run lexicon:coverage
      - run: npm run lexicon:schema
      - run: npm run lexicon:check
      - run: npm run vocabulary:check
