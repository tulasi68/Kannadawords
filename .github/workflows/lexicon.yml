name: Lexicon integrity

on:
  push:
    branches: [main, "architecture/**"]
    paths:
      - "lexicon-source/**"
      - "lexicon-dist/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/lexicon.yml"
  pull_request:
    paths:
      - "lexicon-source/**"
      - "lexicon-dist/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/lexicon.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run lexicon:validate
      - run: npm run lexicon:check
