name: Validate vocabulary etymology
on:
  push:
    branches: [main]
    paths:
      - "etymology-entries.js"
      - "scripts/validate-etymology.cjs"
      - ".github/workflows/validate-etymology.yml"
  pull_request:
    paths:
      - "etymology-entries.js"
      - "scripts/validate-etymology.cjs"
      - ".github/workflows/validate-etymology.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-etymology.cjs
