<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ಕನ್ನಡ ದೇಸಿ · Sanskrit → Dravidian word explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .kn { font-family: 'Noto Sans Kannada', 'Noto Sans', sans-serif; }
    .hero-banner { background: radial-gradient(circle at 12% 15%, rgba(255,220,90,.32), transparent 28%), radial-gradient(circle at 88% 85%, rgba(255,190,70,.24), transparent 30%), linear-gradient(125deg,#991b1b 0%,#c2410c 48%,#b45309 100%); }
    .info-pill { display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; border:1px solid rgba(255,245,190,.7); background:rgba(255,255,255,.13); color:#fff; padding:.6rem .9rem; border-radius:9999px; font-size:.875rem; font-weight:700; transition:background .18s, transform .18s; }
    .info-pill:hover,.info-pill:focus-visible { background:rgba(255,255,255,.25); transform:translateY(-1px); outline:2px solid #fde68a; outline-offset:2px; }
    .main-choice { display:flex; align-items:center; gap:.55rem; width:100%; text-align:left; border:1px solid #fcd34d; border-radius:1rem; padding:.55rem .7rem; background:#fff; color:#7f1d1d; box-shadow:0 2px 8px rgba(120,53,15,.06); transition:all .18s; }
    .main-choice:hover { border-color:#dc2626; transform:translateY(-1px); box-shadow:0 8px 18px rgba(120,53,15,.1); }
    .main-choice-active { background:linear-gradient(110deg,#fff7cc,#ffedd5); border:2px solid #dc2626; box-shadow:0 5px 16px rgba(185,28,28,.12); }
    .main-choice strong { display:block; font-size:.88rem; line-height:1.35; }
    .main-choice small { display:block; margin-top:.1rem; color:#92400e; font-size:.68rem; line-height:1.25; }
    .choice-arrow { margin-left:auto; color:#b91c1c; font-size:1rem; font-weight:700; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
  <header class="hero-banner text-center text-white">
    <div class="max-w-5xl mx-auto px-4 py-5 sm:py-6">
      <h1 class="kn text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight drop-shadow-sm">ಅಚ್ಚ ಕನ್ನಡದ ಕಡೆಗೆ</h1>
      <p class="mt-1 text-sm sm:text-base text-white/90">ನಮ್ಮ ನುಡಿ · ನಮ್ಮ ಆಯ್ಕೆ · ನಮ್ಮ ಮುಂದಿನ ಹೆಜ್ಜೆ</p>
    </div>
  </header>
  <nav class="bg-amber-50 border-b border-amber-200" aria-label="About this project">
    <div class="max-w-5xl mx-auto px-4 py-2 flex items-center justify-center gap-2 sm:gap-3">
      <button type="button" onclick="showInfo('enidu')" class="info-pill !bg-white !text-red-800 !border-amber-300 !px-3 !py-1.5 !text-xs">Enidu</button>
      <button type="button" onclick="showInfo('yaake')" class="info-pill !bg-white !text-red-800 !border-amber-300 !px-3 !py-1.5 !text-xs">Yaake</button>
      <button type="button" onclick="showInfo('mundenu')" class="info-pill !bg-white !text-red-800 !border-amber-300 !px-3 !py-1.5 !text-xs">Mundenu</button>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-4 py-3 sm:py-4">
    <section id="project-info" class="hidden mb-6 rounded-2xl border border-amber-200 bg-white p-5 sm:p-6 shadow-sm" aria-live="polite">
      <div class="flex items-start justify-between gap-3"><div><p id="project-info-kicker" class="text-xs font-bold uppercase tracking-widest text-red-700"></p><h2 id="project-info-title" class="kn text-xl font-bold text-stone-900 mt-1"></h2></div><button type="button" onclick="showInfo(null)" class="rounded-full bg-yellow-100 px-3 py-1.5 text-sm font-semibold text-red-800">Close ✕</button></div>
      <p id="project-info-copy" class="mt-3 text-sm sm:text-base leading-7 text-stone-700"></p>
    </section>
    <nav class="grid grid-cols-2 gap-2 mb-4" aria-label="Community review sections">
      <button id="word-tab" type="button" onclick="showTab('words')" class="main-choice main-choice-active"><span><strong class="kn">ನಿಮಗೆ ಹಿಡಿಸಿದ ನುಡಿಯನ್ನು ಆರಿಸಿ</strong><small>Choose a word you like</small></span><span class="choice-arrow">→</span></button>
      <button id="sentence-tab" type="button" onclick="showTab('sentences')" class="main-choice"><span><strong class="kn">ಈ ನುಡಿಯನ್ನು ಒರೆಹಚ್ಚಿ</strong><small>Test the word in a sentence</small></span><span class="choice-arrow">→</span></button>
      <button id="coinage-tab" type="button" onclick="showTab('coinages')" class="main-choice"><span><strong class="kn">ಹೊಸ ನುಡಿ ಅಳವು</strong><small>Create and assess a new word</small></span><span class="choice-arrow">→</span></button>
      <button id="translate-tab" type="button" onclick="showTab('translate')" class="main-choice"><span><strong class="kn">ಅಚ್ಚ ಕನ್ನಡದಲ್ಲಿ ಮರುಹೇಳಿ</strong><small>Rewrite in native Kannada</small></span><span class="choice-arrow">→</span></button>
    </nav>
    <section id="words-panel"><div id="stats" class="mb-6 text-sm text-stone-500"></div><div id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div><nav id="word-pagination" class="hidden mt-7 flex items-center justify-center gap-4"><button id="word-prev" type="button" onclick="changeWordPage(-1)" disabled class="rounded-lg border border-amber-300 bg-white px-5 py-2.5 text-sm font-semibold text-red-800">← Previous</button><span id="word-page-status" class="text-xs sm:text-sm text-stone-600"></span><button id="word-next" type="button" onclick="changeWordPage(1)" class="rounded-lg border border-amber-300 bg-white px-5 py-2.5 text-sm font-semibold text-red-800">Next →</button></nav></section>
    <section id="sentences-panel" class="hidden"><div id="contextual-grid" class="grid grid-cols-1 gap-4"></div><tbody id="naturalness-body"></tbody></section>
    <section id="coinages-panel" class="hidden"><div id="coin-score-inputs"></div><span id="coin-result"></span><div id="coinage-examples"></div></section>
    <section id="translate-panel" class="hidden">
      <div class="mb-5"><h2 class="kn text-xl font-bold text-stone-900">ಅಚ್ಚ ಕನ್ನಡದಲ್ಲಿ ಮರುಬರೆಯಿರಿ</h2><p class="text-sm text-stone-600 mt-1">AI-assisted Kannada rewriting that prefers native Dravidian-origin Kannada words.</p></div>
      <div class="rounded-xl border border-amber-200 bg-white p-4 sm:p-5"><label for="achcha-input" class="block text-sm font-semibold text-stone-700 mb-2">Kannada text / ಕನ್ನಡ ಪಠ್ಯ</label>
        <textarea id="achcha-input" rows="7" maxlength="4000" class="kn w-full rounded-xl border border-stone-300 px-3 py-3 text-base leading-8" placeholder="ಕನ್ನಡ ವಾಕ್ಯ ಅಥವಾ ಪ್ಯಾರಾಗ್ರಾಫ್ ಇಲ್ಲಿ ಬರೆಯಿರಿ…"></textarea>
        <div class="flex flex-wrap items-center justify-between gap-3 mt-3"><p class="text-xs text-stone-500">Up to 4,000 characters.</p><button id="achcha-submit" type="button" onclick="translateAchchaKannada()" class="rounded-lg bg-amber-700 px-5 py-2.5 text-sm font-semibold text-white">ಅಚ್ಚ ಕನ್ನಡದಲ್ಲಿ ಮರುಬರೆಯಿರಿ</button></div></div>
      <div id="achcha-output" class="hidden mt-5 rounded-xl border border-stone-200 bg-white p-4 sm:p-5" aria-live="polite">
        <p id="achcha-version-label" class="text-xs text-stone-500 mb-3"></p>
        <div class="grid gap-4 md:grid-cols-2"><div class="rounded-lg bg-stone-50 p-3"><h3 class="text-sm font-semibold text-stone-700">ಮೂಲ ಪಠ್ಯ · Original</h3><p id="achcha-original" class="kn whitespace-pre-wrap text-base leading-8 text-stone-800 mt-2"></p></div><div class="rounded-lg bg-amber-50 p-3"><h3 class="text-sm font-semibold text-stone-800">ದ್ರಾವಿಡ ಪದಗಳೊಂದಿಗೆ · Rewritten</h3><p id="achcha-result" class="kn whitespace-pre-wrap text-base leading-8 text-stone-900 mt-2"></p></div></div>
        <div id="achcha-notes" class="mt-4 border-t border-stone-100 pt-3 text-sm text-stone-600"></div>
      </div>
    </section>
  </main>
  <script src="moderation-config.js"></script>
  <script src="data.js"></script>
  <script src="sentence-examples.js"></script>
  <script src="contextual-examples.js"></script>
  <script src="etymology-entries.js"></script>
  <script src="coinage-review.js"></script>
  <script src="app.js?v=20261118-proxy2"></script>
</body>
</html>
